# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "Migrate to the go-strictcli effect model: every command declares its effect, and --dry-run, --quiet and --verbose are now framework-provided on every invocation."
# Optional context explaining why these changes were made
context = """
go-strictcli 0.29.0 made effect classification mandatory: each command must
declare whether it reads, writes, or performs a consequential action. Adopting
it means the framework now supplies the --dry-run/--quiet/--verbose flag
quartet uniformly across every command, replacing per-command ad-hoc handling.

Known ceiling in this release: --dry-run does not yet suppress the embedded
config migration that runs on startup, so a dry-run invocation can still
migrate the config file. This is documented in the effect classification and
will be addressed separately.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
candidate_sha = "4bf0881113559f4e9c38b4a4669b08df1b2a94c0"

[tree_hashes]
"." = "ca546a3b8bbf8f2ba4e36e078eec4aec35303f29"
